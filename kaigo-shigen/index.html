const F={NO:0,CAT:1,TROUBLE:2,SYS:3,DESC:4,CONTACT:5,TEL:6,NOTE:7,LINK:8,URL:9};

const cats=[...new Set(DATA.map(d=>d[F.CAT]))];
const chipsEl=document.getElementById('chips');
let activeCat=null;
function syncChips(){[...chipsEl.children].forEach(c=>c.setAttribute('aria-pressed', c.dataset.val===(activeCat||'')));}
function addChip(label,val){
  const b=document.createElement('button');
  b.className='chip';b.textContent=label;b.dataset.val=val||'';
  b.onclick=()=>{activeCat=(activeCat===val)?null:val;syncChips();render();};
  chipsEl.appendChild(b);
}
addChip('すべて',null);
cats.forEach(c=>addChip(c,c));
syncChips();

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function highlight(s,q){
  s=esc(s); const t=(q||'').trim(); if(!t) return s;
  try{const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return s.replace(re,'<mark>$1</mark>');}catch(e){return s;}
}
// 電話番号（携帯 0X0-XXXX-XXXX / 市外局番つき / 局番省略 XX-XXXX=0853）をタップ発信リンクに
function telify(s){
  s=esc(s);
  return s.replace(/(0[789]0-\d{4}-\d{4})|(0\d{2,3}-\d{2,4}-\d{4})|(?<![\d>\-])(\d{2}-\d{4})(?![\d<\-])/g,
    (m,mob,full,loc)=>{
      const num = mob? mob.replace(/-/g,'') : full? full.replace(/-/g,'') : '0853'+loc.replace(/-/g,'');
      return '<a class="tel" href="tel:'+num+'">'+m+'</a>';
    });
}
const listEl=document.getElementById('list');
const emptyEl=document.getElementById('empty');
const countEl=document.getElementById('count');
const qEl=document.getElementById('q');
const clrEl=document.getElementById('clr');

function render(){
  const q=qEl.value.trim().toLowerCase();
  clrEl.style.display=qEl.value?'block':'none';
  const rows=DATA.filter(d=>{
    if(activeCat && d[F.CAT]!==activeCat) return false;
    if(!q) return true;
    return [d[F.TROUBLE],d[F.SYS],d[F.DESC],d[F.NOTE],d[F.CAT],d[F.CONTACT]].join(' ').toLowerCase().includes(q);
  });
  countEl.textContent=rows.length+'件';
  emptyEl.hidden=rows.length>0;
  const qraw=qEl.value.trim();
  const frag=document.createDocumentFragment();
  for(const d of rows){
    const color=CATS[d[F.CAT]]||'#5C685F';
    const card=document.createElement('article');card.className='card';
    let meta='';
    if(d[F.CONTACT] && d[F.CONTACT]!=='－') meta+='<div class="row"><span class="k">相談先</span><span class="v">'+esc(d[F.CONTACT])+'</span></div>';
    if(d[F.TEL]) meta+='<div class="row"><span class="k">電話</span><span class="v">'+telify(d[F.TEL])+'</span></div>';
    if(d[F.NOTE]) meta+='<div class="row"><span class="k">備考</span><span class="v note">'+telify(d[F.NOTE])+'</span></div>';
    if(d[F.LINK]){
      const lk = d[F.URL] ? '<a class="reflink" href="'+esc(d[F.URL])+'" target="_blank" rel="noopener">'+esc(d[F.LINK])+'</a>' : esc(d[F.LINK]);
      meta+='<div class="row"><span class="k">参考</span><span class="v link">'+lk+'</span></div>';
    }
    card.innerHTML='<div class="body">'
      +'<span class="cat" style="background:'+color+'">'+esc(d[F.CAT])+'</span>'
      +'<p class="trouble">'+highlight(d[F.TROUBLE],qraw)+'</p>'
      +'<p class="system">'+highlight(d[F.SYS],qraw)+'</p>'
      +'<p class="desc">'+highlight(d[F.DESC],qraw)+'</p>'
      +(meta?'<div class="meta">'+meta+'</div>':'')
      +'</div>';
    frag.appendChild(card);
  }
  listEl.innerHTML='';listEl.appendChild(frag);
}
qEl.addEventListener('input',render);
clrEl.addEventListener('click',()=>{qEl.value='';qEl.focus();render();});
render();
